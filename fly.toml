# Fly.io deployment for Contractor Access Expiry.
#
# The volume is the part that matters. The pilot's whole purpose is to measure
# four thresholds over 30 days; an ephemeral filesystem would reset that record
# on every deploy and the gate would read zero without anyone noticing.

app = "contractor-access-expiry"
primary_region = "iad"

[build]

[env]
  CAE_DB = "/data/cae.db"

[[mounts]]
  source = "cae_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero: a cold start drops GitHub webhook deliveries, and
  # an install we fail to record is an install that does not count.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
